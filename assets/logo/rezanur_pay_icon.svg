<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with glow -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle glass shine overlay -->
  <path d="M 10 38 Q 60 15 110 38 L 110 28 Q 110 10 92 10 L 38 10 Q 10 10 10 28 Z" fill="#FFFFFF" opacity="0.15" />

  <!-- Modern Dynamic 'R' + Pay Wings Symbol -->
  <!-- Back angled payment card -->
  <rect x="36" y="32" width="48" height="32" rx="7" transform="rotate(-10 60 48)" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Modern Geometric RP Monogram -->
  <g transform="translate(35, 33)">
    <!-- Main stem -->
    <rect x="0" y="0" width="10" height="54" rx="5" fill="#FFFFFF" />
    
    <!-- Top loop of R -->
    <path d="M 8 0 L 26 0 C 37 0 44 7 44 18 C 44 29 37 35 26 35 L 8 35 Z" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dynamic sweep leg of R forming a forward arrow / payment surge -->
    <path d="M 22 30 L 40 54" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Electric spark / dot -->
    <circle cx="43" cy="18" r="4" fill="#38BDF8" />
  </g>
</svg>