<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGradFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(4, 8) scale(0.72)">
    <rect x="6" y="6" width="104" height="104" rx="28" fill="url(#bgGradFull)" filter="url(#glowFull)" />
    <!-- Glass shine -->
    <path d="M 6 36 Q 58 12 110 36 L 110 26 Q 110 6 90 6 L 26 6 Q 6 6 6 26 Z" fill="#FFFFFF" opacity="0.18" />

    <!-- RP Monogram -->
    <g transform="translate(34, 31)">
      <rect x="0" y="0" width="10" height="54" rx="5" fill="#FFFFFF" />
      <path d="M 8 0 L 26 0 C 37 0 44 7 44 18 C 44 29 37 35 26 35 L 8 35 Z" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 22 30 L 40 54" stroke="url(#accentGradFull)" stroke-width="9" stroke-linecap="round" />
      <circle cx="43" cy="18" r="4.5" fill="#38BDF8" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 32)">
    <!-- REZANUR -->
    <text x="0" y="26" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.5" fill="#0F172A">
      REZANUR
    </text>
    
    <!-- PAY Badge / Gradient Text -->
    <text x="145" y="26" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" letter-spacing="0.5" fill="url(#textGrad)">
      PAY
    </text>

    <!-- Subtitle tagline / pill -->
    <g transform="translate(1, 38)">
      <text x="0" y="9" font-family="'Outfit', sans-serif" font-weight="600" font-size="10" letter-spacing="2.2" fill="#64748B">
        SMART DIGITAL WALLET
      </text>
      <!-- Small verified badge -->
      <circle cx="160" cy="5" r="4" fill="#10B981" />
      <path d="M 158 5 L 159.5 6.5 L 162.5 3.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>